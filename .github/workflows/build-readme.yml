name: Build README

# projects.json 또는 생성기 스크립트가 바뀌면 README.md 를 자동으로 다시 만들고 커밋합니다.
on:
  push:
    paths:
      - "projects.json"
      - "scripts/generate-readme.mjs"
      - ".github/workflows/build-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate README
        run: node scripts/generate-readme.mjs

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate README from projects.json"
            git push
          else
            echo "No README changes."
          fi
